<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probably</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--surface:#ffffff;--text:#1d1d1f;--accent:#5b6cff;--sidebar:#efede8;--radius:16px;--on-accent:#fff;
--ease:cubic-bezier(.22,1,.36,1);
--muted:color-mix(in srgb,var(--text) 55%,var(--bg));--line:color-mix(in srgb,var(--text) 10%,var(--bg));
--soft:color-mix(in srgb,var(--accent) 12%,var(--surface));--serif:'Fraunces',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .5s var(--ease),color .5s var(--ease)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.2}
h1{font-size:34px}h2{font-size:22px}h3{font-size:17px}
small,.muted{color:var(--muted)}
.nomo *,.nomo *::before,.nomo *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg);z-index:50;transition:opacity .6s var(--ease),transform .6s var(--ease),visibility .6s}
#login.gone{opacity:0;transform:scale(1.03);visibility:hidden;pointer-events:none}
.l-art{position:relative;overflow:hidden;background:var(--sidebar);display:flex;align-items:flex-end;padding:56px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;background:var(--accent)}
.b1{width:420px;height:420px;top:-100px;left:-80px;animation:float 14s ease-in-out infinite}
.b2{width:320px;height:320px;bottom:-80px;right:-40px;opacity:.35;animation:float 18s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
.l-brand{position:relative;max-width:380px}
.l-brand .logo{font-size:52px}
.l-brand p{margin-top:12px;color:var(--muted);font-size:17px}
.l-form-wrap{display:grid;place-items:center;padding:32px}
.l-form{width:100%;max-width:360px;animation:rise .8s var(--ease) both}
.l-form h2{font-size:28px;margin-bottom:6px}
.field{margin-top:16px}
.field label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:6px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:0;transition:border-color .25s,box-shadow .25s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.err{color:#d6455d;font-size:13px;min-height:20px;margin-top:10px}
.tabs{display:flex;gap:4px;background:var(--sidebar);padding:4px;border-radius:12px;margin:18px 0 4px;position:relative}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.tabs button.on{color:var(--text)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:9px;transition:transform .45s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs.r .pill{transform:translateX(100%)}
.logo{font-family:var(--serif);font-weight:500;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--accent)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:500;transition:transform .25s var(--ease),box-shadow .25s,opacity .25s,filter .25s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--accent);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{width:100%;margin-top:20px}
.link{color:var(--accent);font-weight:500;font-size:13.5px}
.link:hover{text-decoration:underline}
.spin{width:16px;height:16px;border:2px solid color-mix(in srgb,var(--on-accent) 40%,transparent);border-top-color:var(--on-accent);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- App shell ---------- */
#app{display:none;height:100%;grid-template-columns:244px 1fr;opacity:0}
#app.on{display:grid;animation:appin .8s .15s var(--ease) forwards}
@keyframes appin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
aside{background:var(--sidebar);padding:26px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);transition:background .5s}
aside .logo{font-size:26px;padding:0 12px 22px}
.nav{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;width:100%;text-align:left;transition:color .3s,background .3s,transform .3s var(--ease)}
.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{color:var(--text);transform:translateX(2px)}
.nav.on{color:var(--text);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav.on svg{color:var(--accent)}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;flex:none}
.me b{display:block;font-size:13.5px;line-height:1.2}.me small{font-size:12px}
main{overflow-y:auto;padding:44px 52px 80px;transition:opacity .2s,transform .2s var(--ease)}
main.out{opacity:0;transform:translateY(8px)}
.wrap{max-width:1040px;margin:0 auto}
.rise{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.head{margin-bottom:28px}.head p{color:var(--muted);margin-top:6px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.5fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .5s,border-color .3s}
.card.lift{cursor:pointer}
.card.lift:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px color-mix(in srgb,var(--text) 40%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card h3{margin-bottom:6px}
.ico{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stat b{font-family:var(--serif);font-size:34px;font-weight:500;display:block;line-height:1.1}
.stat small{font-size:13px}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:34px 0 14px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .grow{flex:1;min-width:0}
.row b{font-weight:500}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--accent);letter-spacing:.02em}
.tag.n{background:var(--sidebar);color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width 1.2s var(--ease)}
.trend{display:flex;align-items:flex-end;gap:12px;height:120px;margin-top:10px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--muted)}
.trend i{display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--accent);height:0;transition:height 1.1s var(--ease);opacity:.9}

/* ---------- Gauge ---------- */
.gauge{position:relative;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:9}
.gt{stroke:var(--line)}
.gp{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--ease)}
.gv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
.gv b{font-size:40px;font-weight:500}.gv small{font-size:16px;margin:8px 0 0 2px}

/* ---------- Questionnaire ---------- */
.stage{max-width:660px;margin:0 auto}
.prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.qcard{margin-top:26px;animation:inR .55s var(--ease) both}
.qcard.back{animation-name:inL}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.qcard h2{font-size:28px;margin-bottom:8px}
.qcard>p{color:var(--muted);margin-bottom:22px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{text-align:left;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500;transition:all .3s var(--ease);display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateX(4px)}
.opt.sel{border-color:var(--accent);background:var(--soft);transform:translateX(4px)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;transition:all .3s var(--ease);display:grid;place-items:center}
.opt.sel .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;transition:all .3s var(--ease)}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
.big{font-family:var(--serif);font-size:56px;text-align:center;margin:26px 0 8px}
input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.note{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--soft);display:flex;gap:14px;align-items:center;justify-content:space-between;animation:rise .5s var(--ease) both}
.load{text-align:center;padding:90px 0;animation:rise .6s var(--ease) both}
.orb{width:74px;height:74px;border-radius:50%;margin:0 auto 28px;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 40%,#fff),var(--accent));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18);box-shadow:0 0 0 22px color-mix(in srgb,var(--accent) 12%,transparent)}}
.msg{height:24px;color:var(--muted);transition:opacity .35s}

/* ---------- Report ---------- */
.hero{display:flex;align-items:center;gap:34px;flex-wrap:wrap}
.hero .grow{flex:1;min-width:240px}
.hero h1{margin:8px 0 10px}
.frow{display:grid;grid-template-columns:150px 1fr 90px;gap:14px;align-items:center;padding:9px 0;font-size:14px}
.frow small{text-align:right}
.math{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);padding:14px;border-radius:12px;line-height:1.8;overflow-x:auto;margin-top:12px}
.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden;transition:border-color .3s}
.acc.open{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.acc>button{width:100%;display:flex;align-items:center;gap:14px;padding:18px 22px;text-align:left}
.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;transition:all .4s var(--ease)}
.acc.done .num{background:var(--accent);color:var(--on-accent)}
.acc>button .grow{flex:1}
.chev{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .45s var(--ease)}
.acc.open .chev{transform:rotate(180deg)}
.acc .in{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.acc.open .in{grid-template-rows:1fr}
.in>div{overflow:hidden}
.in .pad{padding:2px 22px 22px 66px}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;transition:all .3s var(--ease)}
.ck svg{width:14px;height:14px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .05s}
.step.on .ck{background:var(--accent);border-color:var(--accent)}
.step.on .ck svg{stroke-dashoffset:0}
.step span{transition:color .3s}.step.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tip{padding:14px 16px;border-radius:12px;background:var(--soft);font-size:14px;margin-bottom:10px}
.tip b{display:block;font-size:12.5px;color:var(--accent);margin-bottom:2px}
.disc{font-size:12.5px;color:var(--muted);margin-top:34px;text-align:center}

/* ---------- Settings ---------- */
.presets{display:flex;gap:12px;flex-wrap:wrap}
.preset{padding:10px;border-radius:14px;border:1px solid var(--line);width:104px;text-align:center;font-size:13px;font-weight:500;transition:all .3s var(--ease)}
.preset:hover{transform:translateY(-3px)}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.sw{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}.sw i{flex:1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cpick{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.cpick input{width:38px;height:38px;border:0;border-radius:10px;background:none;cursor:pointer;padding:0}
.cpick b{display:block;font-weight:500;font-size:14px}.cpick small{font-family:ui-monospace,monospace;font-size:12px}
.sline{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0}
.tg{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .3s;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .4s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(18px)}

@media(max-width:860px){
 #login{grid-template-columns:1fr}.l-art{display:none}
 #app,#app.on{grid-template-columns:1fr;grid-template-rows:1fr auto}
 aside{order:2;flex-direction:row;padding:8px;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
 aside .logo,.me,.spacer{display:none}
 .nav{flex-direction:column;gap:2px;font-size:11px;padding:8px 4px;text-align:center;justify-content:center;width:auto}
 main{padding:26px 20px 40px}.g3,.g2,.g21{grid-template-columns:1fr}h1{font-size:28px}
 .frow{grid-template-columns:110px 1fr 70px}.in .pad{padding-left:22px}
}
@media print{aside,.noprint{display:none!important}#app{display:block!important}main{padding:0;overflow:visible}.acc .in{grid-template-rows:1fr!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="l-art"><div class="blob b1"></div><div class="blob b2"></div>
    <div class="l-brand"><div class="logo">Probably<i>.</i></div><p>Your next step, mapped with honest odds.</p></div>
  </div>
  <div class="l-form-wrap">
    <form class="l-form" id="lf" autocomplete="off">
      <div class="logo" style="font-size:24px;display:none" id="mlogo">Probably<i>.</i></div>
      <h2 id="lt">Welcome back</h2>
      <p class="muted" id="ls">Sign in to continue your roadmap.</p>
      <div class="tabs" id="tabs"><span class="pill"></span><button type="button" class="on" data-m="in">Sign in</button><button type="button" data-m="up">Create account</button></div>
      <div class="field" id="nf" style="display:none"><label>Name</label><input class="input" id="ln" placeholder="Your name"></div>
      <div class="field"><label>Email</label><input class="input" id="le" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input class="input" id="lp" type="password" placeholder="••••••••"></div>
      <div class="err" id="lerr"></div>
      <button class="btn block" id="lbtn" style="margin-top:6px"><span>Sign in</span></button>
      <p style="text-align:center;margin-top:18px"><button type="button" class="link" id="demo">Use demo account</button></p>
      <p class="muted" style="text-align:center;font-size:12.5px;margin-top:8px">Sample login: demo@probably.app / probably123</p>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div class="logo">Probably<i>.</i></div>
    <button class="nav" data-v="home"></button>
    <button class="nav" data-v="builder"></button>
    <button class="nav" data-v="discover"></button>
    <button class="nav" data-v="reports"></button>
    <button class="nav" data-v="settings"></button>
    <div class="spacer"></div>
    <div class="me"><div class="av" id="av"></div><div style="flex:1;min-width:0"><b id="mn"></b><small id="me"></small></div>
      <button id="out" title="Sign out" style="color:var(--muted)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ================= Storage (falls back to memory if blocked) ================= */
const mem={};
const LS={get(k,d){try{const v=localStorage.getItem('pb_'+k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
 set(k,v){mem[k]=v;try{localStorage.setItem('pb_'+k,JSON.stringify(v))}catch(e){}},
 del(k){delete mem[k];try{localStorage.removeItem('pb_'+k)}catch(e){}}};
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const ICON={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',route:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',chev:'<path d="M6 9l6 6 6-6"/>'};

const NAV=[['home','Overview','home'],['builder','Roadmap','route'],['discover','Niche finder','compass'],['reports','Reports','file'],['settings','Settings','gear']];

/* ================= Confidence engine (roadmap) ================= */
function fieldKey(a){return a.edu==='High school'?(STREAM_MAP[a.stream]||'other'):(FIELD_MAP[a.field]||'other')}
function compute(a){
 const D=DOMAINS[a.domain],fk=fieldKey(a);
 const A=FIELD_AFF[fk][a.domain];
 const hv=(a.hobbies||[]).map(h=>((HOB[h]||{})[a.domain])??.1);
 const I=clamp((hv.reduce((s,x)=>s+x,0)/(hv.length||1))/.75,0,1);
 const months=TIMELINE[a.goal]||12,need=D.hours*Math.sqrt(12/months);
 const T=clamp((a.hours||8)/need,0,1);
 let P=a.status==='Studying full-time'?.3:a.status==='Job hunting'?.35:a.status==='Freelancing / building something'?.5:(EXPY[a.exp]??.4);
 if(['Working full-time','Switching careers','Freelancing / building something'].includes(a.status)&&EXPY[a.exp]!=null)P=EXPY[a.exp];
 P+={'Top of the class':.1,'Comfortably good':.05,'Struggling a bit':-.05}[a.standing]||0;
 if(A>=.8)P+=.1; if(a.status==='Switching careers'&&A<.5)P*=.85; P=clamp(P,0,1);
 const R=BUDGET[a.budget]??.8;
 const f=[
  {k:'base',label:'Field success benchmark',v:D.base,w:W.base,note:'sample benchmark'},
  {k:'A',label:'Education alignment',v:A,w:W.A},
  {k:'I',label:'Interest fit',v:I,w:W.I},
  {k:'T',label:'Time commitment',v:T,w:W.T,note:`${a.hours||8}h of ~${need.toFixed(1)}h needed`},
  {k:'P',label:'Experience & momentum',v:P,w:W.P},
  {k:'R',label:'Resources',v:R,w:W.R},
  {k:'D',label:'Market demand',v:D.demand,w:W.D,note:'sample data'}];
 const raw=100*f.reduce((s,x)=>s+x.v*x.w,0),score=Math.round(clamp(raw,30,96));
 const answered=Object.keys(a).length,margin=Math.max(3,Math.round(11-answered*.45));
 const pace=clamp(need/(a.hours||8),.7,2.2),weeks=Math.round(D.months*4.3*pace*(1-.35*P));
 return {score,raw,f,margin,weeks,need,P,D,level:score>=75?'High':score>=55?'Moderate':'Stretch'};
}
function buildPhases(a,r){
 const D=r.D,fr=[.2,.3,.2,.2,.1],tr=D.tracks[a.track]||Object.values(D.tracks)[0];
 const base=[D.ph[0],D.ph[1],{t:'Specialise: '+tr[0],s:[tr[1],`Build one flagship project focused on ${tr[0]}.`,'Document it publicly (write-up, portfolio piece or demo).'],r:['Your flagship project']},D.ph[2],D.ph[3]];
 const extra=[];
 if(['Working full-time','Switching careers'].includes(a.status))extra.push('Protect your income: run this roadmap alongside your job in fixed weekly hours.');
 if(a.status==='Job hunting')extra.push('Run a weekly sprint: 5 targeted applications plus 2 conversations with people in the field.');
 if(a.status==='Studying full-time')extra.push('Map your electives, internships and projects to this roadmap.');
 if(a.status==='Freelancing / building something')extra.push('Turn current client work into portfolio case studies.');
 if(a.sat&&a.sat<5&&['Working full-time','Switching careers'].includes(a.status))extra.push('Write down what you dislike about your current role so you don’t repeat it.');
 return base.map((p,i)=>{let s=[...p.s],w=r.weeks*fr[i];
  if(i===0){if(r.P>=.6){s=['Run a 1-week skills audit against the target role and note the gaps.','Skip topics you already know; fill only the missing pieces.'];w*=.4}s=[...extra,...s]}
  return {t:p.t,w:Math.max(1,Math.round(w)),s,r:p.r}});
}
const progressOf=rep=>{if(rep.type!=='roadmap')return 0;const r=compute(rep.a),ph=buildPhases(rep.a,r),tot=ph.reduce((s,p)=>s+p.s.length,0),d=Object.keys(rep.done||{}).filter(k=>rep.done[k]).length;return tot?Math.round(d/tot*100):0};

 ['Pick a headline you’d love to be part of.',[['Student programme lifts outcomes across a city',{education:2}],['Clinic cuts patient waiting times in half',{health:2}],['Lab finds a better way to store energy',{research:2}],['Startup’s tool reaches one million users',{tech:2,business:2}]]]];
const NMAX=Object.fromEntries(DK.map(k=>[k,NQ.reduce((s,q)=>s+Math.max(...q[1].map(o=>o[1][k]||0)),0)]));
function nicheCalc(picks){
 const sc=Object.fromEntries(DK.map(k=>[k,0])),hit=Object.fromEntries(DK.map(k=>[k,0]));
 picks.forEach((p,i)=>{const w=NQ[i][1][p][1];for(const k in w){sc[k]+=w[k];hit[k]++}});
 const tot=DK.reduce((s,k)=>s+sc[k],0)||1,sh=DK.map(k=>sc[k]/tot);
 const rank=DK.map((k,i)=>({k,s:sc[k],share:sh[i],fit:Math.round(100*sc[k]/NMAX[k]),hit:hit[k]})).sort((a,b)=>b.s-a.s);
 const H=-sh.reduce((s,x)=>s+(x>0?x*Math.log(x):0),0)/Math.log(DK.length);
 const gap=rank[0].share-rank[1].share;
 const conf=Math.round(clamp(100*(.35+1.1*gap+.35*(1-H)),30,95));
 return {rank,conf,gap,H};
}

 {id:'sat',t:'slider',q:'How satisfied are you with what you do today?',sub:'1 = not at all, 10 = love it',min:1,max:10,def:5,show:a=>['Working full-time','Switching careers'].includes(a.status)},
 {id:'search',t:'single',q:'How long have you been searching?',show:a=>a.status==='Job hunting',opts:()=>opt(['Under 1 month','1–3 months','3–6 months','6+ months'])},
 {id:'hobbies',t:'multi',max:5,q:'Which hobbies do you actually enjoy?',sub:'Pick up to 5.',opts:()=>opt(Object.keys(HOB))},
 {id:'domain',t:'single',q:'Where do you want to end up?',sub:'Your aspiration, in broad strokes.',opts:()=>[...DK.map(k=>({v:k,l:DOMAINS[k].name})),{v:'unsure',l:'I’m not sure yet'}]},
 {id:'track',t:'single',q:a=>`Which direction in ${DOMAINS[a.domain].name} pulls you most?`,show:a=>a.domain&&a.domain!=='unsure',opts:a=>Object.entries(DOMAINS[a.domain].tracks).map(([k,v])=>({v:k,l:v[0]}))},

let B;

VIEWS.builder=(m,pre)=>{

 m.innerHTML=`<div class="wrap"><div class="stage">

function drawQ(dir){
 const vis=visQ();let q=vis.find(x=>x.id===B.cur)||vis[0];B.cur=q.id;const pos=vis.indexOf(q),a=B.a;
 $('#bs').textContent=`Question ${pos+1} of ${vis.length}`;$('#bp').textContent=Math.round(pos/vis.length*100)+'%';
 setTimeout(()=>$('#bf').style.width=(pos/vis.length*100)+'%',10);
 const title=typeof q.q==='function'?q.q(a):q.q,opts=q.opts?q.opts(a):[];
 if(q.t==='slider'&&a[q.id]==null)a[q.id]=q.def;
 let body='';
 if(q.t==='text')body=`<input class="input" id="ti" value="${esc(a[q.id]||'')}" placeholder="${q.ph}" style="font-size:18px;padding:16px" autofocus>`;
 if(q.t==='single')body=`<div class="opts">${opts.map(o=>`<button class="opt ${a[q.id]===o.v?'sel':''}" data-v="${esc(o.v)}"><span>${esc(o.l)}</span><span class="dot"></span></button>`).join('')}</div>`;
 if(q.t==='multi')body=`<div class="chips">${opts.map(o=>`<button class="chip ${(a[q.id]||[]).includes(o.v)?'sel':''}" data-v="${esc(o.v)}">${esc(o.l)}</button>`).join('')}</div>`;
 if(q.t==='slider')body=`<div class="big"><span id="sv">${a[q.id]}</span><small style="font-size:18px">${q.unit||' / 10'}</small></div><input type="range" id="sl" min="${q.min}" max="${q.max}" value="${a[q.id]}">`;
 const unsure=q.id==='domain'&&a.domain==='unsure'?`<div class="note"><span>No problem. The Niche Finder will help you work it out first.</span><button class="btn" id="tofind">Open Niche Finder</button></div>`:'';
 $('#qc').innerHTML=`<div class="qcard ${dir<0?'back':''}"><h2>${esc(title)}</h2>${q.sub?`<p>${q.sub}</p>`:'<div style="height:10px"></div>'}${body}${unsure}
 <div class="foot"><button class="btn ghost" id="bk" ${pos===0?'style="visibility:hidden"':''}>Back</button><button class="btn" id="nx">${pos===vis.length-1?'Generate report':'Continue'}</button></div></div>`;
 const valid=()=>q.t==='text'?(a[q.id]||'').trim().length>0:q.t==='single'?!!a[q.id]&&a[q.id]!=='unsure':q.t==='multi'?(a[q.id]||[]).length>0:true;
 const upd=()=>$('#nx').disabled=!valid();upd();
 const next=()=>{const v=visQ(),p=v.findIndex(x=>x.id===B.cur);if(p<v.length-1){B.cur=v[p+1].id;drawQ(1)}else finishBuilder()};
 $('#nx').onclick=next;
 $('#bk').onclick=()=>{const v=visQ(),p=v.findIndex(x=>x.id===B.cur);if(p>0){B.cur=v[p-1].id;drawQ(-1)}};
 if(q.t==='text'){const ti=$('#ti');ti.oninput=()=>{a[q.id]=ti.value;upd()};ti.onkeydown=e=>{if(e.key==='Enter'&&valid())next()};ti.focus()}
 if(q.t==='single')$$('.opt').forEach(b=>b.onclick=()=>{a[q.id]=b.dataset.v;if(q.id==='domain')delete a.track;$$('.opt').forEach(x=>x.classList.toggle('sel',x===b));upd();
  if(a.domain==='unsure'&&q.id==='domain'){drawQ(1);return}if(valid())setTimeout(next,320)});
 if(q.t==='multi')$$('.chip').forEach(b=>b.onclick=()=>{const l=a[q.id]||[],v=b.dataset.v,i=l.indexOf(v);if(i>=0)l.splice(i,1);else if(l.length<q.max)l.push(v);a[q.id]=l;b.classList.toggle('sel',l.includes(v));upd()});
 if(q.t==='slider')$('#sl').oninput=e=>{a[q.id]=+e.target.value;$('#sv').textContent=e.target.value};
 if($('#tofind'))$('#tofind').onclick=()=>go('discover');
}
function analyse(host,msgs,done){
 host.innerHTML=`<div class="load"><div class="orb"></div><h2>Calculating your odds</h2><div class="msg" id="lm"></div></div>`;
 let i=0;const lm=$('#lm'),tick=()=>{lm.style.opacity=0;setTimeout(()=>{lm.textContent=msgs[i++]||'';lm.style.opacity=1},300)};tick();
 const iv=setInterval(()=>{if(i<msgs.length)tick()},800);setTimeout(()=>{clearInterval(iv);done()},msgs.length*800+500);
}
function finishBuilder(){

}

function roadmapReport(m,rep){
 const a=rep.a,r=compute(a),ph=buildPhases(a,r),D=r.D,tr=D.tracks[a.track]||Object.values(D.tracks)[0];
 const target=new Date(Date.now()+r.weeks*7*864e5).toLocaleDateString(undefined,{month:'long',year:'numeric'});

 m.innerHTML=`<div class="wrap">
 <div class="noprint rise" style="margin-bottom:18px"><button class="link" id="bk">← All reports</button></div>
 <div class="card rise"><div class="hero">${gaugeHTML(r.score,170)}<div class="grow">
  <span class="tag">${r.level} confidence · likely range ${lo}–${hi}%</span>

  <div class="noprint" style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="pr">Save as PDF</button><button class="btn ghost" id="rt">Retake</button></div></div></div></div>
 <div class="grid g2" style="margin-top:18px">
  <div class="card rise"><h3>Why this score</h3><small>Each factor (0–100%) × its weight</small><div style="margin-top:8px">${factorRows(r.f)}</div></div>

   <div class="res" style="margin-top:12px">${D.roles.map(x=>`<span class="tag">${x}</span>`).join('')}</div>
   <p style="margin-top:16px" class="muted">${D.day}</p>

 <div class="sec rise">Your roadmap</div>
 <div class="card rise" style="padding:18px 22px;margin-bottom:14px"><div class="row" style="padding:0;border:0"><b>Progress</b><div class="grow"><div class="bar"><i id="pgb" data-w="0"></i></div></div><small id="pgt"></small></div></div>
 <div id="phases">${ph.map((p,i)=>`<div class="acc rise ${i===0?'open':''}" data-p="${i}"><button><span class="num">${i+1}</span><span class="grow"><b>${esc(p.t)}</b><br><small>~${p.w} week${p.w>1?'s':''} · ${p.s.length} steps</small></span>${svg('chev','chev')}</button>
  <div class="in"><div><div class="pad">${p.s.map((s,j)=>`<div class="step ${rep.done[i+'-'+j]?'on':''}" data-k="${i}-${j}"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span><span>${esc(s)}</span></div>`).join('')}
  <div class="res">${p.r.map(x=>`<span class="tag n">${esc(x)}</span>`).join('')}</div></div></div></div></div>`).join('')}</div>
 <div class="card rise" style="margin-top:22px"><h3>How we calculated it</h3><small>Transparent by design</small>
  <div class="math">Score = 100 × Σ (weight × factor)<br>= 100 × (${r.f.map(x=>`${x.w}×${x.v.toFixed(2)}`).join(' + ')})<br>= ${r.raw.toFixed(1)} → <b>${r.score}%</b> (bounded 30–96)<br>Range = score ± ${r.margin} (narrows as you answer more questions)<br>Timeline = field months × pace(${(r.need/a.hours).toFixed(2)}) × (1 − 0.35 × momentum ${r.P.toFixed(2)}) = ${r.weeks} wks</div></div>

 setTimeout(upd,60);

 const mark=()=>$$('.preset',m).forEach(b=>b.classList.toggle('on',Object.keys(PRESETS[b.dataset.p]).every(k=>PRESETS[b.dataset.p][k]===theme[k])));mark();
 $$('.preset',m).forEach(b=>b.onclick=()=>{Object.assign(theme,PRESETS[b.dataset.p]);applyTheme();$$('[data-k]',m).forEach(i=>{i.value=theme[i.dataset.k];$('#h-'+i.dataset.k).textContent=theme[i.dataset.k]});mark()});
 $$('[data-k]',m).forEach(i=>i.oninput=()=>{theme[i.dataset.k]=i.value;$('#h-'+i.dataset.k).textContent=i.value;applyTheme();mark()});
 $('#rad').oninput=e=>{theme.radius=+e.target.value;applyTheme()};
 $('#calm').onclick=e=>{theme.calm=!theme.calm;e.target.classList.toggle('on',theme.calm);applyTheme()};
 $('#so').onclick=logout;$('#rs').onclick=()=>{LS.del('reports');go('settings')};
};

/* ================= Auth ================= */
let mode='in';
$$('#tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#tabs').classList.toggle('r',mode==='up');
 $('#nf').style.display=mode==='up'?'block':'none';$('#lt').textContent=mode==='up'?'Create your account':'Welcome back';$('#lbtn span').textContent=mode==='up'?'Create account':'Sign in';$('#lerr').textContent=''});
function enter(user,instant){LS.set('user',user);$('#av').textContent=user.name[0].toUpperCase();$('#mn').textContent=user.name;$('#me').textContent=user.email;
 $('#login').classList.add('gone');$('#app').classList.add('on');main.innerHTML='';go('home')}
function logout(){LS.del('user');$('#app').classList.remove('on');$('#login').classList.remove('gone');$('#lp').value='';main.innerHTML=''}
$('#demo').onclick=()=>{$('#le').value='demo@probably.app';$('#lp').value='probably123';$('#lf').requestSubmit()};
$('#lf').onsubmit=e=>{e.preventDefault();
 const em=$('#le').value.trim(),pw=$('#lp').value,btn=$('#lbtn'),err=$('#lerr');
 const fail=t=>{err.textContent=t;$('#lf').classList.remove('shake');void $('#lf').offsetWidth;$('#lf').classList.add('shake')};
 if(!/^\S+@\S+\.\S+$/.test(em))return fail('Please enter a valid email address.');
 if(mode==='in'&&!(em==='demo@probably.app'&&pw==='probably123'))return fail('Those details don’t match the demo account.');
 if(mode==='up'&&pw.length<6)return fail('Use at least 6 characters for your password.');
 err.textContent='';btn.innerHTML='<div class="spin"></div>';btn.style.pointerEvents='none';
 setTimeout(()=>{btn.innerHTML=`<span>${mode==='up'?'Create account':'Sign in'}</span>`;btn.style.pointerEvents='';
  enter({name:mode==='up'?($('#ln').value.trim()||em.split('@')[0]):'Demo User',email:em})},800);
};
const saved=LS.get('user',null);if(saved){enter(saved)}
</script>
</body>
</html>
